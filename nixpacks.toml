[phases.setup]
nixPkgs = [
    "chromium",
    "glib",
    "nss",
    "nspr",
    "atk",
    "cups",
    "dbus",
    "expat",
    "libdrm",
    "libxkbcommon",
    "pango",
    "cairo",
    "xorg.libX11",
    "xorg.libXcomposite",
    "xorg.libXdamage",
    "xorg.libXext",
    "xorg.libXfixes",
    "xorg.libXrandr",
    "xorg.libxcb",
    "xorg.libXcursor",
    "xorg.libXi",
    "xorg.libXrender",
    "xorg.libXtst",
    "xorg.libXScrnSaver"
]

[phases.install]
cmds = [
    "pip3 install -r requirements.txt",
    "python3 -m playwright install chromium",
    "python3 -m playwright install-deps chromium"
]

[start]
cmd = "python3 -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
