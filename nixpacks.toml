[phases.setup]
nixPkgs = ["chromium", "glib", "nss", "nspr", "atk", "cups", "dbus", "expat",
           "libdrm", "libxkbcommon", "mesa", "libGL", "pango", "cairo",
           "xorg.libX11", "xorg.libXcomposite", "xorg.libXdamage",
           "xorg.libXext", "xorg.libXfixes", "xorg.libXrandr",
           "xorg.libxcb", "xorg.libXcursor", "xorg.libXi", "xorg.libXrender",
           "xorg.libXtst", "xorg.libXScrnSaver"]

[phases.install]
cmds = [
    "pip install -r requirements.txt",
    "playwright install chromium --with-deps"
]

[start]
cmd = "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
